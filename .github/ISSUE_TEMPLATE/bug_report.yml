name: Bug report
description: Something is broken (for released versions)
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the steps to reproduce and the expected vs actual behaviour. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version, placeholder: "e.g. 0.2.0" }
  - type: input
    id: env
    attributes: { label: Environment, placeholder: "OS, Node version, database" }
