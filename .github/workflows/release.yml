# Managed by strutvane-tooling (canonical/.github/workflows/release.yml). Do not edit in package repos:
# change it in strutvane-tooling and run `pnpm sync` there.
#
# Release flow (ADR-0016, "version on main, CI publishes what's new"):
#   1. Contributors add changesets. A maintainer runs `changeset version` and commits
#      `chore(release): <name>@<version>` on main.
#   2. On every push to main, this workflow runs the full quality gate, then publishes the version
#      in package.json ONLY if it's not on npm yet (idempotent). The dist-tag comes from the version:
#      x.y.z → latest, x.y.z-next.N → next, x.y.z-canary.N → canary.
#   3. Publishing uses npm TRUSTED PUBLISHING (GitHub OIDC) with provenance. No npm token exists.
# One-time setup per package:
#   1. npmjs.com → package → Settings → Trusted publishing → GitHub Actions:
#      owner `vishwajit-vm`, repository `<this repo>`, workflow `release.yml`.
#   2. GitHub → repo → Settings → Variables → Actions: RELEASE_ENABLED = true.
# Until step 2 is done this workflow is skipped, so a repo can never try to publish early.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner == 'vishwajit-vm' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: No local-only dependencies (link:/file:/workspace:)
        run: node .github/scripts/check-deps.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Quality gate (never publish a broken build)
        run: pnpm run ci

      - name: Publish if this version is new (trusted publishing, provenance)
        run: node .github/scripts/publish-if-new.mjs
