# Managed by strutvane-tooling (canonical/.github/workflows/ci.yml). Do not edit in package repos:
# change it in strutvane-tooling and run `pnpm sync` there.
#
# Runs the repo's full quality gate (`pnpm run ci` = lint + typecheck + test + build) on every
# push to main and every pull request, on Linux, Windows and macOS, on Node 24 and 26 (both LTS).
# Actions are pinned to full commit SHAs (tag in the trailing comment) to prevent supply-chain
# attacks through moved tags; Dependabot keeps them up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: No local-only dependencies (link:/file:/workspace:)
        run: node .github/scripts/check-deps.mjs

      - name: Install (lockfile must be up to date)
        run: pnpm install --frozen-lockfile

      - name: Quality gate (lint, typecheck, test, build)
        run: pnpm run ci
